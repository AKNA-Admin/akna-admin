<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS-2TBAT | Solutions Digitales, BTP, Immobilier & Courtage</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        :root {
            --primary-color: #0c62ce; /* Bleu royal du logo */
            --accent-color: #bd0fc1; /* Violet vibrant du logo */
            --secondary-color: #0f172a; /* Bleu nuit ultra-professionnel */
            --text-main: #334155; /* Couleur du texte principal */
            --text-muted: #64748b; /* Couleur du texte secondaire */
            --bg-light: #f8fafc;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* En-tête de navigation */
        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 55px; 
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary-color); 
            margin-left: 12px;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--primary-color); 
        }

        .nav-cta {
            background-color: var(--primary-color);
            color: var(--white) !important;
            padding: 8px 18px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(12, 98, 206, 0.2);
        }

        .nav-cta:hover {
            background-color: #0b54b1;
        }

        /* Section Hero (Bannière Professionnelle) */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--white);
            padding: 140px 20px 100px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before, .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .hero::before {
            top: -20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: rgba(12, 98, 206, 0.15);
        }

        .hero::after {
            bottom: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: rgba(189, 15, 193, 0.12);
        }

        .hero-content {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            z-index: 1;
        }

        .hero h1 {
            font-size: 3.8rem;
            margin: 0 0 24px 0;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            background: linear-gradient(to right, #ffffff, #f1f5f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.35rem;
            color: #cbd5e1;
            max-width: 750px;
            margin: 0 auto 40px auto;
            font-weight: 400;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 15px 36px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
            box-shadow: 0 4px 14px rgba(12, 98, 206, 0.4);
        }

        .btn-primary:hover {
            background-color: #0b54b1;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Section Chiffres clés (Confiance) */
        .stats-section {
            background-color: var(--white);
            padding: 40px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: relative;
            z-index: 10;
            margin-top: -40px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .stat-item h3 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-weight: 800;
        }

        .stat-item p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Section Expertises */
        .section-padding {
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 60px auto;
        }

        .section-title {
            font-size: 2.4rem;
            color: var(--secondary-color);
            margin: 0 0 15px 0;
            font-weight: 800;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--white);
            border-radius: 14px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -15px rgba(12, 98, 206, 0.12);
            border-color: rgba(12, 98, 206, 0.2);
        }

        .card-icon {
            font-size: 2.5rem;
            background-color: var(--bg-light);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin-bottom: 25px;
            transition: background 0.3s;
        }

        .card:hover .card-icon {
            background-color: rgba(12, 98, 206, 0.08);
        }

        .card h3 {
            font-size: 1.35rem;
            color: var(--secondary-color);
            margin: 0 0 15px 0;
            font-weight: 700;
        }

        .card p {
            color: var(--text-main);
            font-size: 0.98rem;
            margin: 0;
            color: #475569;
        }

        /* Section Contact & Formulaire */
        .contact-bg {
            background-color: var(--white);
            border-top: 1px solid #e2e8f0;
        }

        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 60px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .contact-layout { grid-template-columns: 1fr; gap: 40px; }
            .hero h1 { font-size: 2.6rem; }
        }

        .contact-meta h2 {
            font-size: 2.2rem;
            color: var(--secondary-color);
            margin: 0 0 20px 0;
            font-weight: 800;
        }

        .contact-meta p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0 0 40px 0;
        }

        .info-block {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .info-icon {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-right: 20px;
            margin-top: 3px;
        }

        .info-content h4 {
            margin: 0 0 5px 0;
            color: var(--secondary-color);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .info-content p, .info-content a {
            margin: 0;
            color: var(--text-main);
            font-size: 1.05rem;
            text-decoration: none;
        }

        .info-content a:hover {
            color: var(--primary-color);
        }

        /* Formulaire */
        .contact-form {
            background-color: var(--bg-light);
            padding: 40px;
border-radius: 16px;
border: 1px solid #e2e8f0;
}

.form-group {
margin-bottom: 20px;
}

.form-group label {
display: block;
margin-bottom: 8px;
font-weight: 600;
font-size: 0.9rem;
color: var(--secondary-color);
}

.form-control {
width: 100%;
padding: 12px 16px;
border: 1px solid #cbd5e1;
background-color: var(--white);
border-radius: 8px;
font-size: 1rem;
color: var(--secondary-color);
transition: border-color 0.2s;
}

.form-control:focus {
outline: none;
border-color: var(--primary-color);
box-shadow: 0 0 0 3px rgba(12, 98, 206, 0.1);
}

.btn-submit {
width: 100%;
background-color: var(--secondary-color);
color: var(--white);
border: none;
padding: 14px;
font-size: 1rem;
font-weight: 600;
border-radius: 8px;
cursor: pointer;
transition: background 0.2s;
}

.btn-submit:hover {
background-color: var(--primary-color);
}

/* Pied de page */
footer {
background-color: var(--secondary-color);
color: #94a3b8;
padding: 60px 20px 30px 20px;
font-size: 0.95rem;
border-top: 4px solid var(--accent-color);
}

.footer-grid {
max-width: 1200px;
margin: 0 auto;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 20px;
border-bottom: 1px solid #334155;
padding-bottom: 40px;
margin-bottom: 30px;
}

.footer-logo {
font-size: 1.3rem;
font-weight: 800;
color: var(--white);
}

.footer-links a {
color: #94a3b8;
text-decoration: none;
margin-left: 20px;
}

.footer-links a:hover {
color: var(--white);
}

.copyright {
text-align: center;
margin: 0;
font-size: 0.88rem;
color: #64748b;
}
